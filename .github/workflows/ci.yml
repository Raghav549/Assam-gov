name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Backend tests (OTP, SMTP + HTTPS email providers, auth flow)
        run: npm test
      - name: Frontend build (warnings are errors)
        run: npm run build
        env:
          CI: true
